# Wildcard routing: any model name is forwarded to GitHub Copilot automatically.
# No need to update this file when new models are released.
model_list:
  - model_name: "*"
    litellm_params:
      model: "github_copilot/*"
      extra_headers: {"Editor-Version": "vscode/1.85.1", "Copilot-Integration-Id": "vscode-chat"}

litellm_settings:
  drop_params: true
